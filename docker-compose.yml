services:
  postgres:
    build: ./docker/postgres
    image: carddb-pg16-hintplan
    container_name: carddb
    environment:
      POSTGRES_USER: postgres
      # no default: put POSTGRES_PASSWORD in .env (see .env.example)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: carddb
    ports:
      - "127.0.0.1:55432:5432"  # localhost only; 5432/5433 are often taken by local installs
    volumes:
      - carddb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  carddb_data:
