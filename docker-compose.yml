version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: carddb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: carddb
    ports:
      - "5432:5432"
    volumes:
      - carddb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  carddb_data:
